# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: fluidra.qm.managehu.managehandlinguints
type: application
framework:
  name: SAPUI5
  version: 1.120.46
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.fe.templates
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://virtualds4:44300
            client: '050'
            destination: S4HANA
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata4/sap/zui_managehandlingunits_o4/srvd/sap/zui_managehandlingunits/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
            resolveExternalServiceReferences: true
          - urlPath: /sap/opu/odata/SAP/API_INSPECTIONLOT_SRV
            metadataPath: ./webapp/localService/InspectionLotSrv/metadata.xml
            mockdataPath: ./webapp/localService/InspectionLotSrv/data
            generateMockData: true
          - urlPath: /sap/opu/odata/SAP/QM_INSPUSGDSC_MANAGE_SRV
            metadataPath: ./webapp/localService/QmInspUDSrv/metadata.xml
            mockdataPath: ./webapp/localService/QmInspUDSrv/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/InspectionLotSrv/API_INSPECTIONLOT_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='API_INSPECTIONLOT_ANNO_MDL',Version='0001')/$value/
          - localPath: ./webapp/localService/QmInspUDSrv/QM_INSPUSGDSC_MANAGE_ANNO_MDL.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='QM_INSPUSGDSC_MANAGE_ANNO_MDL',Version='0001')/$value/
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
